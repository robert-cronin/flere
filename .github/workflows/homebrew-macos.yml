name: Homebrew macOS acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-macos-acceptance
  cancel-in-progress: false

jobs:
  lifecycle:
    if: github.repository == 'robert-cronin/flere' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VALIDATION_RUNNER: ${{ matrix.runner }}
      VALIDATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check the validation helper without installing anything
        run: /usr/bin/ruby scripts/test_homebrew_macos_ci.rb
      - id: lifecycle
        name: Fresh default-prefix source install, version upgrade and removal
        # Only the helper may mutate this disposable hosted VM. It rejects local
        # and self-hosted execution, and never inherits the checkout token.
        run: /usr/bin/ruby scripts/homebrew-macos-ci.rb
      - name: Retain bounded validation receipts and command logs
        if: always() && steps.lifecycle.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homebrew-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.lifecycle.outputs.evidence }}/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
