name: Windows retained candidate recipes

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-retained-candidate-recipes
  cancel-in-progress: false

jobs:
  recipes:
    if: github.repository == 'robert-cronin/flere' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      FLERE_WORKFLOW_SHA: ${{ github.workflow_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Require the hosted manual Windows job
        env:
          FLERE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:FLERE_RUNNER_ENVIRONMENT -ne 'github-hosted' -or
              $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or $env:GITHUB_REPOSITORY -ne 'robert-cronin/flere' -or
              $env:GITHUB_REF -ne 'refs/heads/main' -or $env:RUNNER_OS -ne 'Windows' -or
              $env:RUNNER_ARCH -ne 'X64' -or [Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') {
            throw 'Only the hosted manual Windows AMD64 job is supported.'
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Check the generator
        shell: pwsh
        run: |
          python -B scripts/test_windows_manifests.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows generator checks failed.' }
      - id: recipes
        name: Validate recipes for the retained ZIP without rebuilding or running it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FLERE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $Root = Join-Path $HOME '.cache/flere/tmp'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          $Output = Join-Path $Root ("windows-recipes-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-" + [guid]::NewGuid().ToString('N'))
          python -B packaging/windows/recipe-check.py $Output
          if ($LASTEXITCODE -ne 0) { throw 'Windows recipe checks failed; preserve evidence.' }
      - name: Retain only recipes and bounded proof
        if: always() && steps.recipes.outputs.evidence != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-recipes-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.recipes.outputs.evidence }}/receipt.json
            ${{ steps.recipes.outputs.evidence }}/input/*.json
            ${{ steps.recipes.outputs.evidence }}/logs/*.log
            ${{ steps.recipes.outputs.evidence }}/windows/*.zip
            ${{ steps.recipes.outputs.evidence }}/windows/*.json
            ${{ steps.recipes.outputs.evidence }}/windows/SHA256SUMS.windows
            ${{ steps.recipes.outputs.evidence }}/windows/winget/manifests/r/RobertCronin/FlereConnect/0.3.4/*.yaml
            ${{ steps.recipes.outputs.evidence }}/windows/scoop/bucket/flere.json
            ${{ steps.recipes.outputs.evidence }}/windows/chocolatey/flere-connect/flere-connect.nuspec
            ${{ steps.recipes.outputs.evidence }}/windows/chocolatey/flere-connect/tools/chocolateyInstall.ps1
            ${{ steps.recipes.outputs.evidence }}/windows/chocolatey-package/*.nupkg
          if-no-files-found: error
          retention-days: 14
          overwrite: false
