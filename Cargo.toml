[package]
name = "flere"
version = "0.3.14"
edition = "2024"
rust-version = "1.98"
description = "A terminal workbench for persistent shells, peer agents, editors, and Git"
license = "MIT AND OFL-1.1"
repository = "https://github.com/robert-cronin/flere"
readme = "packaging/cargo/README.md"
keywords = ["terminal", "workspace", "agents", "git", "editor"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/build-support/**",
    "/tests/fixtures/local-image.png",
    "/tests/fixtures/local-image.jpg",
    "/packaging/cargo/README.md",
    "/LICENSE",
    "/Cargo.lock",
]
build = "build-support/build.rs"

[dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
shell-words = "1"
libc = "0.2"
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }

[build-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
