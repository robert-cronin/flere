[package]
name = "flere"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
description = "A small Linux and macOS terminal workbench with a custom UI"
build = "build-support/build.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
shell-words = "1"
libc = "0.2"
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
png = "0.18"
jpeg-decoder = { version = "0.3", default-features = false }

[build-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, features = ["wayland"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
